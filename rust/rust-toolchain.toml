# Rust の版を固定する（docs/rust-migration-plan.md §8）。版を上げるときは
# 一致確認（tools/golden/verify.sh rust）と計測をやり直す。
[toolchain]
channel = "1.98.1"
components = ["rustfmt", "clippy"]
# wasm32-unknown-unknown: ブラウザ版（web クレート）
# wasm32-wasip1: コアのテストを 32 ビットの wasm で走らせる（Node の WASI で実行）
targets = ["wasm32-unknown-unknown", "wasm32-wasip1"]
profile = "minimal"
